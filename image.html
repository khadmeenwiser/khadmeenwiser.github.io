<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071521" />
    <title>Gallery | KHADMEEN WISER</title>
    <meta name="description" content="Explore the KHADMEEN WISER image gallery." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #071521;
        --panel: rgba(15, 31, 45, 0.82);
        --text: #eef8ff;
        --muted: #a9c3d5;
        --blue: #58d0ff;
        --purple: #9b8cff;
        --border: rgba(255, 255, 255, 0.11);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font: 16px/1.6 "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(ellipse at 12% 0%, rgba(88, 208, 255, 0.16), transparent 33rem),
          radial-gradient(ellipse at 90% 10%, rgba(155, 140, 255, 0.12), transparent 30rem),
          var(--bg);
      }
      a { color: inherit; text-decoration: none; }
      .container { width: min(1160px, calc(100% - 36px)); margin-inline: auto; }
      .header {
        position: sticky;
        top: 0;
        z-index: 5;
        border-bottom: 1px solid var(--border);
        background: rgba(7, 21, 33, 0.88);
        backdrop-filter: blur(16px);
      }
      .header-inner {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: 0.07em; }
      .brand-mark {
        width: 40px; height: 40px; display: grid; place-items: center;
        border-radius: 13px; color: #041723; font-weight: 900;
        background: linear-gradient(135deg, var(--blue), var(--purple));
      }
      .floating-logo {
        position: fixed; right: 24px; bottom: 24px; z-index: 30;
        width: 76px; height: 76px; display: grid; place-items: center;
        border: 1px solid rgba(255,255,255,.55); border-radius: 26px;
        background: linear-gradient(145deg, #66dcff, #438cf5 58%, #a184ff);
        box-shadow: 0 12px 32px rgba(32,155,229,.38), inset 0 1px 0 rgba(255,255,255,.6);
        animation: logo-float 4s ease-in-out infinite;
        transition: transform .25s ease, box-shadow .25s ease;
      }
      .floating-logo::before {
        content: ""; position: absolute; inset: -7px; z-index: -1;
        border: 1px solid rgba(88,208,255,.35); border-radius: 31px;
        animation: logo-glow 3s ease-in-out infinite;
      }
      .floating-logo:hover, .floating-logo:focus-visible {
        transform: translateY(-5px) scale(1.04);
        box-shadow: 0 18px 38px rgba(32,155,229,.48), inset 0 1px 0 rgba(255,255,255,.65);
      }
      .floating-logo:focus-visible { outline: 3px solid var(--text); outline-offset: 7px; }
      .floating-logo svg { width: 49px; height: 49px; filter: drop-shadow(0 3px 4px rgba(2,14,30,.25)); }
      .floating-logo-label {
        position: absolute; right: 88px; padding: 8px 12px;
        border: 1px solid var(--border); border-radius: 999px;
        color: var(--text); background: rgba(10,21,32,.94);
        box-shadow: 0 12px 32px rgba(0,0,0,.3); font-size: .78rem;
        font-weight: 800; letter-spacing: .08em; white-space: nowrap;
        opacity: 0; transform: translateX(6px);
        transition: opacity .2s ease, transform .2s ease; pointer-events: none;
      }
      .floating-logo:hover .floating-logo-label, .floating-logo:focus-visible .floating-logo-label {
        opacity: 1; transform: translateX(0);
      }
      @keyframes logo-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }
      @keyframes logo-glow { 0%, 100% { opacity: .45; transform: scale(.98); } 50% { opacity: 1; transform: scale(1.04); } }
      nav { display: flex; flex-wrap: wrap; gap: 22px; color: var(--muted); }
      nav a:hover, nav a[aria-current="page"] { color: var(--blue); }
      .button {
        display: inline-flex; justify-content: center; align-items: center;
        border-radius: 999px; padding: 11px 18px; font-weight: 700;
        color: #041723; background: linear-gradient(135deg, var(--blue), #26aee8);
      }
      main { padding: 76px 0 88px; }
      .intro { max-width: 690px; margin-bottom: 34px; }
      .eyebrow {
        display: inline-block; margin-bottom: 14px; padding: 6px 12px;
        border: 1px solid rgba(88, 208, 255, 0.3); border-radius: 99px;
        color: var(--blue); background: rgba(88, 208, 255, 0.09);
        font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      }
      h1 { margin: 0 0 14px; font-size: clamp(2.6rem, 7vw, 4.8rem); line-height: 1; letter-spacing: -0.06em; }
      .intro p { margin: 0; color: var(--muted); font-size: 1.08rem; }
      .gallery {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: 220px;
        gap: 16px;
      }
      .tile {
        position: relative; overflow: hidden; min-width: 0;
        border: 1px solid var(--border); border-radius: 20px;
        background: var(--panel); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      }
      .tile:nth-child(5n + 1), .tile:nth-child(5n + 4) { grid-row: span 2; }
      .tile img {
        width: 100%; height: 100%; object-fit: cover;
        transition: transform 0.45s ease, filter 0.45s ease;
      }
      .tile:hover img { transform: scale(1.045); filter: brightness(0.78); }
      .tile figcaption {
        position: absolute; inset: auto 0 0; padding: 32px 16px 14px;
        color: white; font-weight: 700;
        background: linear-gradient(transparent, rgba(3, 12, 20, 0.83));
      }
      .footer { padding: 25px 0; border-top: 1px solid var(--border); color: var(--muted); }
      .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; }
      .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
      .footer-links a:hover { color: var(--blue); }
      @media (max-width: 850px) {
        .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 190px; }
      }
      @media (max-width: 650px) {
        .header-inner { padding-block: 12px; flex-wrap: wrap; }
        nav { order: 3; width: 100%; justify-content: space-between; gap: 10px; font-size: 0.92rem; }
        .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 180px; gap: 10px; }
        .tile:nth-child(5n + 1), .tile:nth-child(5n + 4) { grid-row: span 1; }
        .tile:nth-child(4n + 1) { grid-row: span 2; }
        main { padding-top: 52px; }
        .floating-logo { right: 16px; bottom: 16px; width: 62px; height: 62px; border-radius: 21px; }
        .floating-logo::before { border-radius: 26px; }
        .floating-logo svg { width: 41px; height: 41px; }
        .floating-logo-label { display: none; }
      }
      @media (max-width: 380px) {
        .gallery { grid-template-columns: 1fr; grid-auto-rows: 240px; }
        .tile:nth-child(n) { grid-row: span 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .floating-logo, .floating-logo::before { animation: none; }
      }
    </style>
  </head>
